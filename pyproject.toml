[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tranq"
version = "0.2.1"
description = "Modern, decorator-based error handling for Python – calm your code."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "RaptorVampire", email = "mhman884@gmail.com"}
]
keywords = ["error-handling", "retry", "decorator", "logging", "tranquil", "async", "circuit-breaker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "black>=23"]

[project.scripts]
tranq = "tranq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
